name: Archtour Guardrails

# Live test of Archtour 0.3.0 before release: the README workflow verbatim, except that it uses the Action files
# vendored in ./archtour-action instead of Zune2004/archtour@v0.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./archtour-action
        with:
          mode: check
