name: Archtour Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  merge_group:

permissions:
  contents: read
  pull-requests: write

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Label test for 0.3.3 (needs-human gate), runs the unreleased main.
      - uses: Zune2004/archtour@main
        id: archtour
        with:
          mode: check
          needs-human-label: needs-human
      - if: ${{ !cancelled() }}
        run: |
          echo "needs-human=${{ steps.archtour.outputs.needs-human }}"
          echo "needs-human-reasons=${{ steps.archtour.outputs.needs-human-reasons }}"
          echo "verdict=${{ steps.archtour.outputs.verdict }}"
