name: 'Archtour'
description: "The review step for changes you can't undo. Blocks risky pull requests: dropped columns, breaking API changes, privileged containers, public ports, deleted databases."
author: 'Zune2004'

inputs:
  paths:
    description: 'Folder or directory to scan'
    required: false
    default: '.'
  ignore:
    description: 'Comma-separated list of paths or folders to ignore'
    required: false
    default: ''
  mode:
    description: 'Execution mode: "check" (architecture guardrails, default)'
    required: false
    default: 'check'
  strict-release:
    description: 'Whether soft findings fail release, tag, or push runs (hard findings always fail)'
    required: false
    default: 'false'
  comment:
    description: 'Whether to post or update a PR comment'
    required: false
    default: 'true'
  github-token:
    description: 'GitHub token for PR commenting and API checks'
    required: false
    default: ${{ github.token }}
  include-tests:
    description: 'Whether to scan test, fixture, and example directories (disabled by default)'
    required: false
    default: 'false'
  migration-dirs:
    description: 'Comma-separated extra folders whose .sql files are migrations (e.g. "db/deploy,sql/changes")'
    required: false
    default: ''
  max-file-size:
    description: 'Skip files larger than this many MB (default 5)'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate Mode
      id: validate-mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        if [ "$MODE" != "check" ]; then
          echo "::error::Invalid mode '$MODE'. Must be 'check'."
          exit 3
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install Archtour dependencies
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        cd "$ACTION_PATH"
        if [ -f package-lock.json ]; then
          npm ci --omit=dev
        else
          npm install --omit=dev
        fi

    - name: Check out base into worktree
      id: checkout-base
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_REF: ${{ github.base_ref }}
        MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
        PUSH_BEFORE: ${{ github.event.before }}
        PUSH_AFTER: ${{ github.event.after }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        REF_NAME: ${{ github.ref_name }}
        REF: ${{ github.ref }}
      run: |
        BASE_COMMIT=""
        if [ "$EVENT_NAME" = "pull_request" ]; then
          # actions/checkout checks out GitHub's test merge of the PR into the CURRENT base branch, while
          # pull_request.base.sha can be older (it does not move when the base branch moves). Diffing the merge against
          # that old sha would blame the PR for everything merged into the base since. The merge's first parent is the
          # base it was built on.
          MERGE_PARENTS=$(git rev-list --parents -n 1 HEAD 2>/dev/null | wc -w | tr -d ' ')
          if [ "$MERGE_PARENTS" = "3" ] && [ -n "$PR_HEAD_SHA" ] && [ "$(git rev-parse HEAD^2 2>/dev/null)" = "$PR_HEAD_SHA" ]; then
            BASE_COMMIT=$(git rev-parse HEAD^1)
          elif [ -n "$BASE_SHA" ] && git rev-parse --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            BASE_COMMIT="$BASE_SHA"
          elif [ -n "$BASE_REF" ] && git rev-parse --verify "origin/${BASE_REF}^{commit}" >/dev/null 2>&1; then
            BASE_COMMIT="origin/$BASE_REF"
          elif [ -n "$BASE_REF" ] && git rev-parse --verify "${BASE_REF}^{commit}" >/dev/null 2>&1; then
            BASE_COMMIT="$BASE_REF"
          elif [ -n "$BASE_SHA" ]; then
            BASE_COMMIT="$BASE_SHA"
          fi
        elif [ "$EVENT_NAME" = "merge_group" ]; then
          if [ -n "$MG_BASE_SHA" ]; then
            BASE_COMMIT="$MG_BASE_SHA"
          elif [ -n "$MG_BASE_REF" ]; then
            BASE_COMMIT="$MG_BASE_REF"
          fi
        elif [ "$EVENT_NAME" = "release" ] || { [ "$EVENT_NAME" = "push" ] && [[ "$REF" == refs/tags/* ]]; }; then
          git fetch --tags 2>/dev/null || true
          TAG_NAME="${RELEASE_TAG:-${REF_NAME:-${REF#refs/tags/}}}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            BASE_COMMIT="$PREV_TAG"
          else
            FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD 2>/dev/null | tail -n 1 || true)
            if [ -n "$FIRST_COMMIT" ]; then
              echo "::notice::No previous tag found for ${TAG_NAME}; falling back to initial commit ${FIRST_COMMIT}"
              BASE_COMMIT="$FIRST_COMMIT"
            fi
          fi
        elif [ "$EVENT_NAME" = "push" ]; then
          if [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT="$PUSH_BEFORE"
          else
            FALLBACK=$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD 2>/dev/null | tail -n 1 || true)
            if [ -n "$FALLBACK" ]; then
              echo "::notice::No before SHA for branch push; falling back to commit ${FALLBACK}"
              BASE_COMMIT="$FALLBACK"
            fi
          fi
        fi

        if [ -z "$BASE_COMMIT" ]; then
          echo "::error::Base commit for event '$EVENT_NAME' could not be resolved. Please ensure actions/checkout uses 'fetch-depth: 0'."
          exit 1
        fi

        if ! git rev-parse --verify "${BASE_COMMIT}^{commit}" >/dev/null 2>&1; then
          echo "Base commit $BASE_COMMIT missing locally; fetching from origin..."
          git fetch --no-tags --depth=1 origin "$BASE_COMMIT" 2>/dev/null || true
        fi

        if ! git rev-parse --verify "${BASE_COMMIT}^{commit}" >/dev/null 2>&1; then
          echo "::error::Base commit '$BASE_COMMIT' could not be found even after fetch. Please ensure actions/checkout uses 'fetch-depth: 0'."
          exit 1
        fi

        BASE_DIR="${RUNNER_TEMP:-/tmp}/archtour-base"
        rm -rf "$BASE_DIR"
        git worktree prune || true
        git worktree add --detach "$BASE_DIR" "$BASE_COMMIT"
        CLEAN_BASE_DIR=$(printf '%s' "$BASE_DIR" | tr -d '\r\n')
        echo "base_dir=$CLEAN_BASE_DIR" >> "$GITHUB_OUTPUT"
        CLEAN_BASE_COMMIT=$(printf '%s' "$BASE_COMMIT" | tr -d '\r\n')
        echo "base_commit=$CLEAN_BASE_COMMIT" >> "$GITHUB_OUTPUT"

    - name: Resolve Guardrails Override
      id: override
      if: inputs.mode == 'check' && github.event_name == 'pull_request'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        ARCHTOUR_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        INPUT_PATHS: ${{ inputs.paths }}
      run: |
        node "$ACTION_PATH/tools/override.mjs"

    - name: Cache Archtour facts
      # Never on PRs or the merge queue: a PR could save poisoned entries in its own cache scope (for example with a
      # workflow edit it later reverts) and restore them in the run that gates it. Within one run the cache only holds
      # facts that run computed itself.
      if: inputs.mode == 'check' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' && github.event_name != 'merge_group'
      uses: actions/cache@v4
      with:
        path: ${{ runner.temp }}/archtour-cache
        # Content-addressed entries (blob SHA + Archtour version): restore the newest cache, save a new one per commit
        key: archtour-facts-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          archtour-facts-${{ runner.os }}-

    - name: Run Archtour Guardrails Check
      id: check
      if: inputs.mode == 'check'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BASE_DIR: ${{ steps.checkout-base.outputs.base_dir }}
        BASE_COMMIT: ${{ steps.checkout-base.outputs.base_commit }}
        WORKSPACE: ${{ github.workspace }}
        INPUT_PATHS: ${{ inputs.paths }}
        INPUT_IGNORE: ${{ inputs.ignore }}
        INPUT_STRICT_RELEASE: ${{ inputs.strict-release }}
        INPUT_INCLUDE_TESTS: ${{ inputs.include-tests }}
        INPUT_MIGRATION_DIRS: ${{ inputs.migration-dirs }}
        INPUT_MAX_FILE_SIZE: ${{ inputs.max-file-size }}
        EVENT_NAME: ${{ github.event_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        ARCHTOUR_HAS_OVERRIDE: ${{ env.ARCHTOUR_HAS_OVERRIDE }}
        ARCHTOUR_OVERRIDE_RULE: ${{ env.ARCHTOUR_OVERRIDE_RULE }}
        ARCHTOUR_OVERRIDE_SHA: ${{ env.ARCHTOUR_OVERRIDE_SHA }}
        ARCHTOUR_OVERRIDE_BY: ${{ env.ARCHTOUR_OVERRIDE_BY }}
        ARCHTOUR_OVERRIDE_PERMISSION: ${{ env.ARCHTOUR_OVERRIDE_PERMISSION }}
        ARCHTOUR_PR_AUTHOR: ${{ env.ARCHTOUR_PR_AUTHOR }}
        ARCHTOUR_OVERRIDE_REASON: ${{ env.ARCHTOUR_OVERRIDE_REASON }}
        ARCHTOUR_OWNER_TEAMS: ${{ env.ARCHTOUR_OWNER_TEAMS }}
      run: |
        HEAD_SCAN="$WORKSPACE/$INPUT_PATHS"
        OUTPUT_DIR="${RUNNER_TEMP:-/tmp}/archtour-check"
        CACHE_DIR="${RUNNER_TEMP:-/tmp}/archtour-cache"
        mkdir -p "$OUTPUT_DIR" "$CACHE_DIR"

        if [ -n "$BASE_COMMIT" ]; then
          CHECK_ARGS=(
            --changed-from "$BASE_COMMIT"
            "$HEAD_SCAN"
            --include-untracked
            --cache-dir "$CACHE_DIR"
            --policy-from base
            --json
            --md "$OUTPUT_DIR/guardrails.md"
          )
        else
          BASE_SCAN="$BASE_DIR/$INPUT_PATHS"
          CHECK_ARGS=(
            "$BASE_SCAN" "$HEAD_SCAN"
            --cache-dir "$CACHE_DIR"
            --policy-from base
            --json
            --md "$OUTPUT_DIR/guardrails.md"
          )
        fi

        if [ -n "$PR_HEAD_SHA" ]; then
          CHECK_ARGS+=(--head-sha "$PR_HEAD_SHA")
        fi

        # Override values come from PR-comment text. They are always passed as one --flag=value argument, so a value can
        # never stand in an option position (a bare `--override help` used to print usage and exit 0).
        if [ "$ARCHTOUR_HAS_OVERRIDE" = "true" ] && [ -n "$ARCHTOUR_OVERRIDE_RULE" ]; then
          CHECK_ARGS+=("--override=$ARCHTOUR_OVERRIDE_RULE")
          if [ -n "$ARCHTOUR_OVERRIDE_SHA" ]; then
            CHECK_ARGS+=("--override-sha=$ARCHTOUR_OVERRIDE_SHA")
          fi
          if [ -n "$ARCHTOUR_OVERRIDE_BY" ]; then
            CHECK_ARGS+=("--override-by=$ARCHTOUR_OVERRIDE_BY")
          fi
          if [ -n "$ARCHTOUR_OVERRIDE_PERMISSION" ]; then
            CHECK_ARGS+=("--override-permission=$ARCHTOUR_OVERRIDE_PERMISSION")
          fi
          if [ -n "$ARCHTOUR_PR_AUTHOR" ]; then
            CHECK_ARGS+=("--pr-author=$ARCHTOUR_PR_AUTHOR")
          fi
          if [ -n "$ARCHTOUR_OVERRIDE_REASON" ]; then
            CHECK_ARGS+=("--override-reason=$ARCHTOUR_OVERRIDE_REASON")
          fi
          if [ -n "$ARCHTOUR_OWNER_TEAMS" ]; then
            CHECK_ARGS+=("--owner-teams=$ARCHTOUR_OWNER_TEAMS")
          fi
        fi

        if [ "$INPUT_INCLUDE_TESTS" = "true" ]; then
          CHECK_ARGS+=(--include-tests)
        fi

        if [ -n "$INPUT_IGNORE" ]; then
          IFS=',' read -ra IGNORE_PARTS <<< "$INPUT_IGNORE"
          for item in "${IGNORE_PARTS[@]}"; do
            item=$(printf '%s' "$item" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            if [ -n "$item" ]; then
              CHECK_ARGS+=("--ignore=$item")
            fi
          done
        fi

        if [ -n "$INPUT_MIGRATION_DIRS" ]; then
          CHECK_ARGS+=("--migration-dir=$INPUT_MIGRATION_DIRS")
        fi

        if [ -n "$INPUT_MAX_FILE_SIZE" ]; then
          CHECK_ARGS+=("--max-file-size=$INPUT_MAX_FILE_SIZE")
        fi

        set +e
        node "$ACTION_PATH/tools/diagram.mjs" check "${CHECK_ARGS[@]}" > "$OUTPUT_DIR/check-result.json" 2> "$OUTPUT_DIR/check.err"
        CHECK_EXIT=$?
        set -e

        if [ -s "$OUTPUT_DIR/check.err" ]; then
          cat "$OUTPUT_DIR/check.err"
        fi

        # A check result that is not JSON is not a pass: with the old argv bypass, stdout was usage text and its parse
        # error was swallowed. Fail closed (exit 3) and show what the CLI actually wrote.
        if [ "$CHECK_EXIT" -eq 0 ] || [ "$CHECK_EXIT" -eq 1 ] || [ "$CHECK_EXIT" -eq 2 ]; then
          if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$OUTPUT_DIR/check-result.json" 2>/dev/null; then
            echo "::error::Archtour check did not produce valid JSON (exit code $CHECK_EXIT); refusing to treat this run as a pass."
            head -n 20 "$OUTPUT_DIR/check-result.json" 2>/dev/null || true
            exit 3
          fi
        fi

        if [ -n "$GITHUB_STEP_SUMMARY" ] && [ -f "$OUTPUT_DIR/guardrails.md" ]; then
          cat "$OUTPUT_DIR/guardrails.md" >> "$GITHUB_STEP_SUMMARY"
        fi

        CLEAN_OUTPUT_DIR=$(printf '%s' "$OUTPUT_DIR" | tr -d '\r\n')
        echo "output_dir=$CLEAN_OUTPUT_DIR" >> "$GITHUB_OUTPUT"
        CLEAN_CHECK_EXIT=$(printf '%s' "$CHECK_EXIT" | tr -d '\r\n')
        echo "exit_code=$CLEAN_CHECK_EXIT" >> "$GITHUB_OUTPUT"

        if [ -f "$OUTPUT_DIR/guardrails.md" ]; then
          CLEAN_HAS_REPORT="true"
          echo "has_report=$CLEAN_HAS_REPORT" >> "$GITHUB_OUTPUT"
        fi

        if [ -f "$OUTPUT_DIR/check-result.json" ]; then
          node -e '
            const fs = require("fs");
            try {
              const res = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              for (const f of (res.findings || [])) {
                if (f.level === "warn" || f.level === "advisory") {
                  // Workflow-command escaping (finding text comes from the PR): % CR LF in data, plus : , in properties.
                  const esc = (v) => String(v).replace(/%/g, "%25").replace(/\r/g, "%0D").replace(/\n/g, "%0A");
                  const escProp = (v) => esc(v).replace(/:/g, "%3A").replace(/,/g, "%2C");
                  const msg = esc(`[${f.ruleId}] ${f.message || ""}`);
                  if (f.source && f.source.file) {
                    const linePart = Number.isInteger(f.source.line) ? `,line=${f.source.line}` : "";
                    console.log(`::warning file=${escProp(f.source.file)}${linePart}::${msg}`);
                  } else {
                    console.log(`::warning::${msg}`);
                  }
                }
              }
            } catch (e) {}
          ' "$OUTPUT_DIR/check-result.json"
        fi

        if [ "$CHECK_EXIT" -eq 1 ]; then
          echo "::error::Architecture guardrails failed with hard findings (exit code 1)."
          exit 1
        elif [ "$CHECK_EXIT" -eq 3 ]; then
          echo "::error::Architecture guardrails configuration error (exit code 3)."
          exit 3
        elif [ "$CHECK_EXIT" -eq 2 ]; then
          if [ "$EVENT_NAME" = "pull_request" ] || [ "$INPUT_STRICT_RELEASE" = "true" ]; then
            echo "::error::Architecture guardrails failed with unoverridden soft findings (exit code 2)."
            exit 2
          else
            echo "::notice::Architecture guardrails has soft findings (exit code 2), passing because strict-release is not set."
          fi
        elif [ "$CHECK_EXIT" -ne 0 ]; then
          echo "::error::Archtour check crashed (exit code $CHECK_EXIT)"
          exit "$CHECK_EXIT"
        fi

    - name: Post or Update PR Comment
      # !cancelled(): the check step exits non-zero on findings, and a failing PR is exactly when the comment is needed
      if: ${{ !cancelled() && inputs.comment == 'true' && github.event_name == 'pull_request' && github.event.pull_request.number != '' && inputs.mode == 'check' }}
      uses: actions/github-script@v7
      env:
        CHECK_OUTPUT_DIR: ${{ steps.check.outputs.output_dir }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');

          const checkOutputDir = process.env.CHECK_OUTPUT_DIR || '';
          const checkCommentPath = checkOutputDir ? path.join(checkOutputDir, 'guardrails.md') : '';

          let guardrailsMd = '';
          if (fs.existsSync(checkCommentPath)) {
            guardrailsMd = fs.readFileSync(checkCommentPath, 'utf8').trim();
          }

          if (!guardrailsMd) {
            console.log('No guardrails markdown file found at', checkCommentPath);
            return;
          }

          const marker = '<!-- archtour-guardrails -->';
          const body = `<!-- archtour-guardrails -->\n\n${guardrailsMd}\n\n*Generated by [Archtour](https://github.com/Zune2004/archtour)*`;

          try {
            const prNumber = context.payload.pull_request ? context.payload.pull_request.number : context.issue.number;
            if (!prNumber) {
              console.log('No PR number found in context');
              return;
            }

            let botLogin = 'github-actions[bot]';
            try {
              const { data: authUser } = await github.rest.users.getAuthenticated();
              if (authUser && authUser.login) {
                botLogin = authUser.login;
              }
            } catch (e) {
              // GITHUB_TOKEN cannot call getAuthenticated; fall back to github-actions[bot]
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const botComment = comments.find(comment =>
              comment.body &&
              comment.body.includes(marker) &&
              comment.user &&
              comment.user.type === 'Bot' &&
              comment.user.login === botLogin
            );

            if (botComment) {
              console.log('Updating existing archtour comment', botComment.id);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              console.log('Creating new archtour comment on PR', prNumber);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
          } catch (err) {
            core.warning("Could not post the PR comment (fork PR or missing pull-requests: write). The report is in this run's summary.");
          }

    - name: Cleanup Base Worktree
      if: always()
      shell: bash
      env:
        BASE_DIR: ${{ steps.checkout-base.outputs.base_dir }}
      run: |
        if [ -n "$BASE_DIR" ] && [ -d "$BASE_DIR" ]; then
          git worktree remove --force "$BASE_DIR" 2>/dev/null || true
          rm -rf "$BASE_DIR" 2>/dev/null || true
          git worktree prune 2>/dev/null || true
        fi
